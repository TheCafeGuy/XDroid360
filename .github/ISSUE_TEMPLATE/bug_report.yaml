name: Bug report
description: Report a crash, hang, graphical glitch, audio problem or other bug in XDroid360.
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Only report bugs in XDroid360 builds. Issues in desktop Xenia, Canary or Edge belong on their own trackers.
        Do not ask for, link to or attach games, disc images, keys or firmware. Such issues are closed and removed.
  - id: validation
    type: checkboxes
    attributes:
      label: Validation
      options:
      - label: I use a game I own and dumped myself.
        required: true
      - label: I searched existing issues and this one is not reported yet.
        required: true
  - id: build
    type: input
    attributes:
      label: Build
      description: Build hash shown in the app or logged at boot (`XDroid360: build <hash>`).
    validations:
      required: true
  - id: device
    type: input
    attributes:
      label: Device and Android version
      placeholder: e.g. Snapdragon 8 Gen 3 phone, Android 15
    validations:
      required: true
  - id: driver
    type: input
    attributes:
      label: GPU driver
      placeholder: system driver, or Turnip version
    validations:
      required: true
  - id: game
    type: input
    attributes:
      label: Game and title ID
      placeholder: e.g. Ace Combat 6 (4E4D07D1)
  - id: description
    type: textarea
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce. Screenshots or videos help for graphical bugs.
    validations:
      required: true
  - id: log
    type: textarea
    attributes:
      label: Log
      description: Attach the log file, or paste the relevant part.
      render: text
