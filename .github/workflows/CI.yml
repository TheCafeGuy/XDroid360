name: CI

# XDroid360 ships only an Android APK, built and tested on the maintainer's
# machine and device, and takes issues rather than pull requests. The desktop
# builds inherited from xenia (Linux, Windows, macOS, about an hour per run)
# checked nothing that ships, so CI keeps only the format lint.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup
        run: |
          pipx install clang-format==21.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ./xenia-build.py lint --all
